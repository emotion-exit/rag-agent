[project]
name = "rag-agent-backend"
version = "0.1.0"
description = "RAG Agent Backend with FastAPI, ADK, SiliconFlow, and OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "google-adk>=1.0.0",
    "litellm>=1.40.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "rapidocr-onnxruntime>=1.4.4",
    "pillow>=10.0.0",
    "chardet>=5.0.0",
    "aiofiles>=23.0.0",
    "sse-starlette>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = []
